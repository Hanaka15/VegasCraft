; VegasCraft: Fallout New Vegas with Minecraft physics, inventory and blocks.
; Goes in Data\NVSE\Plugins\ next to vegascraft.dll.

[Minecraft]
; Start Minecraft when FNV starts. Under Proton this is Windows Prism inside the
; same wineprefix (CreateProcess from the plugin) so Local\VegasCraft_v1 works.
; It stays hidden once the Fabric mod is up, opens the VegasCraft world, and quits
; when FNV closes. 0 = start Minecraft yourself (still must be Windows MC in this prefix).
bStartWithHost = 1

; Empty: use the bundled portable Prism (Data\NVSE\Plugins\VegasCraft\VegasCraft-Minecraft.zip),
; unpacked to %LOCALAPPDATA%\VegasCraft (inside the Proton prefix's Local AppData).
; Or set a full Windows path to prismlauncher.exe / a .bat inside this prefix.
sLauncher =

; Prism instance folder name inside the bundle.
sArguments = --launch VegasCraft

[VegasCraft]
bDiagnostics = 0

[Gameplay]
fUnitsPerBlock = 70.0
fMcToFnvDamageScale = 5.0
fFnvToMcDamageDivisor = 5.0
bDigEnabled = 1
